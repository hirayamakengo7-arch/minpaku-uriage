<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>民泊売上</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f5f6f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="民泊売上">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --ink:#1f2937; --sub:#6b7280; --mute:#9aa3b2; --line:#eceef3; --bg:#f5f6f9; --card:#ffffff;
  --navy:#1f2a44; --accent:#4263eb; --air:#f0616d; --bkg:#2a5db0; --up:#0f9d6b; --down:#e0464f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-size:15px}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:rgba(245,246,249,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 8px}
.hrow{display:flex;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.02em}
.upd{font-size:11px;color:var(--mute)}
.btn-ref{border:0;background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;border-radius:999px;padding:7px 13px;background:#fff;color:var(--sub);font-size:13px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.chip.on{background:var(--navy);color:#fff}
main{padding:6px 16px calc(env(safe-area-inset-bottom) + 84px)}
.card{background:var(--card);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.hero .lbl{font-size:12px;color:var(--sub);font-weight:600}
.hero .big{font-size:34px;font-weight:800;margin:4px 0 2px;letter-spacing:-.01em}
.hero .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px}
.badge.up{background:#e6f6ef;color:var(--up)} .badge.down{background:#fdecee;color:var(--down)} .badge.flat{background:#eef0f4;color:var(--sub)}
.small{font-size:12px;color:var(--sub)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tile{background:#fff;border-radius:16px;padding:12px 10px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.tile .lbl{font-size:11px;color:var(--sub);font-weight:600}
.tile .v{font-size:18px;font-weight:800;margin-top:4px}
.tile .s{font-size:10.5px;color:var(--mute);margin-top:2px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 4px}
.sec h2{font-size:15px;margin:0;font-weight:800}
.seg{display:inline-flex;background:#e9ecf2;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.room{display:flex;gap:12px;align-items:center}
.room .body{flex:1;min-width:0}
.ring{flex:0 0 auto;width:54px;height:54px;position:relative}
.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .t b{font-size:13px;font-weight:800}
.ring .t small{font-size:8.5px;color:var(--mute);margin-top:2px;font-weight:700}
.occlg{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--sub);margin:2px 4px 0}
.room .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.room .nm{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room .amt{font-weight:800;font-size:17px;white-space:nowrap}
.room .meta{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--sub)}
.bar{height:6px;border-radius:99px;background:#eef0f4;overflow:hidden;margin-top:8px;display:flex}
.bar i{display:block;height:100%}
.occ i{background:linear-gradient(90deg,#5b7cfa,#4263eb)}
.split{height:4px;margin-top:6px}
.list{background:#fff;border-radius:18px;box-shadow:0 1px 3px rgba(16,24,40,.05);overflow:hidden;margin:10px 0}
.list .it{padding:13px 16px;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.chart{width:100%;height:150px;display:block}
.legend{display:flex;gap:12px;font-size:11px;color:var(--sub);margin-top:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.site{font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px;color:#fff;margin-right:6px;vertical-align:1px}
.site.air{background:var(--air)} .site.bkg{background:var(--bkg)} .site.oth{background:var(--mute)}
.bk .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bk .rm{font-weight:700;font-size:14.5px}
.bk .l2{font-size:12px;color:var(--sub);margin-top:4px;display:flex;justify-content:space-between}
.day{font-size:12px;font-weight:800;color:var(--sub);margin:16px 4px 0}
.day b{color:var(--ink)}
.today3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.empty{color:var(--mute);font-size:13px;padding:14px 16px}
.dept .top{display:flex;justify-content:space-between;gap:8px}
.dept .nm{font-size:13.5px;font-weight:700}
.dept .v{font-weight:800}
.neg{color:var(--down)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;border:0;background:transparent;padding:6px 0;color:var(--mute);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--navy)}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;color:var(--sub);gap:12px;font-size:13px}
.spin{width:28px;height:28px;border:3px solid #dfe3ea;border-top-color:var(--navy);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.note{font-size:11px;color:var(--mute);margin:10px 4px;line-height:1.6}
/* シート表示（スプレッドシートの見た目をそのまま） */
.shbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px 8px;flex-wrap:wrap}
.shzoom{display:inline-flex;background:#e9ecf2;border-radius:10px;padding:3px;gap:2px}
.shzoom button{border:0;background:transparent;padding:5px 10px;border-radius:8px;font-size:13px;font-weight:800;color:var(--sub);cursor:pointer}
.shzoom button:hover{background:#fff}
.shwrap{background:#fff;border-radius:20px;box-shadow:0 1px 3px rgba(16,24,40,.05);overflow:auto;max-height:calc(100dvh - 215px);-webkit-overflow-scrolling:touch;padding:18px 20px}
table.sg{border-collapse:separate;border-spacing:0;table-layout:fixed;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;color:#1f2937;background:transparent;font-variant-numeric:tabular-nums}
table.sg td{padding:0 6px;overflow:hidden;white-space:pre;vertical-align:middle;line-height:1.3;font-size:13.3px;position:relative}
table.sg td.ln{border-bottom:1px solid #eef0f5}
table.sg tr:hover td.ln{box-shadow:inset 0 0 0 999px rgba(66,99,235,.045)}
table.sg td.hd{letter-spacing:.02em}
table.sg td.hd.hl{border-top-left-radius:10px;border-bottom-left-radius:10px}
table.sg td.hd.hr{border-top-right-radius:10px;border-bottom-right-radius:10px}
table.sg td.kp{border-radius:12px}
.sgring{display:inline-flex;align-items:center;gap:7px;justify-content:flex-end;width:100%}
.sgring svg{width:22px;height:22px;transform:rotate(-90deg);flex:0 0 auto}
.sgwrap{position:relative}
.sgchart{position:absolute;background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(16,24,40,.08);border:1px solid #eef0f5;padding:14px 16px 10px;box-sizing:border-box;z-index:4;display:flex;flex-direction:column}
.sgchart h4{margin:0 0 6px;font-size:14px;font-weight:800;color:#1f2a44}
.sgchart svg{flex:1;width:100%;min-height:0}
.sgchart .lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:#6b7280;margin-top:6px}
.sgchart .lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.shtop{display:grid;grid-template-columns:1fr;gap:14px;margin:0 0 14px}
.shtop .card{margin:0}
table.sg td.ov{overflow:visible}
table.sg td.wr{white-space:pre-wrap;word-break:break-word}
table.sg td.st{position:sticky;background:#fff;z-index:2}
table.sg td.st.stc{z-index:3}
table.sg td.nt{cursor:help}
table.sg i.spk{position:absolute;left:6px;top:28%;bottom:28%;display:block;border-radius:99px;opacity:.9}
table.sg i.spkbg{position:absolute;left:6px;right:6px;top:28%;bottom:28%;display:block;border-radius:99px;background:#eef1f7}
.shload{padding:40px 0;text-align:center;color:var(--sub);font-size:13px}
nav .subnav{display:none}
nav button[data-tab="sheet"]{display:none}
@media (min-width:960px){
  .shwrap{max-height:none;overflow:auto}
  body.tsheet .chips{display:none!important}
  body.tsheet header{padding-bottom:4px}
  body.tsheet main>*{max-width:none}
  nav button[data-tab="sheet"]{display:flex}
  nav .subnav{display:flex;flex-direction:column;gap:2px;margin:2px 0 6px 10px;padding-left:12px;border-left:2px solid #eef0f4}
  nav .subnav a{font-size:13px;color:var(--sub);padding:6px 10px;border-radius:8px;cursor:pointer;text-decoration:none;font-weight:600}
  nav .subnav a:hover{background:#f3f4f8}
  nav .subnav a.on{color:var(--accent);background:#eef1ff}
}
/* 予約カレンダー */
.calbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 2px 8px;flex-wrap:wrap}
.calleg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--sub)}
.calleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.calwrap{background:#fff;border-radius:18px;box-shadow:0 1px 3px rgba(16,24,40,.05);overflow:auto;max-height:calc(100dvh - 230px);position:relative;-webkit-overflow-scrolling:touch}
.calin{position:relative}
.calhead{position:sticky;top:0;z-index:4;background:#fff;display:flex;border-bottom:1px solid var(--line)}
.calcorner{position:sticky;left:0;z-index:5;background:#fff;flex:0 0 auto;display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px 6px;font-size:10px;color:var(--mute);font-weight:700;border-right:1px solid var(--line)}
.calcorner b{font-size:15px;color:var(--ink);font-weight:800}
.caldays{position:relative;flex:0 0 auto}
.calmon{position:absolute;top:6px;font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap;padding-left:4px}
.calday{position:absolute;top:26px;text-align:center;line-height:1.15}
.calday b{display:block;font-size:12px;font-weight:800;margin:0 auto;width:24px;height:24px;line-height:24px;border-radius:50%}
.calday small{display:block;font-size:9.5px;color:var(--mute);font-weight:700}
.calday em{display:block;font-style:normal;font-size:9.5px;color:var(--mute);margin-top:3px}
.calday.sat b{color:#2a5db0} .calday.sun b{color:#e0464f}
.calday.today b{background:var(--navy);color:#fff}
.calday.full em{color:#c3c9d4}
.calgrid{position:absolute;top:0;bottom:0;z-index:0}
.calgrid i{position:absolute;top:0;bottom:0;border-right:1px solid #f1f2f6}
.calgrid i.we{background:#f7f8fb} .calgrid i.td{background:#fff6d6}
.calrow{display:flex;position:relative;z-index:1;border-bottom:1px solid #f1f2f6}
.calname{position:sticky;left:0;z-index:3;background:#fff;flex:0 0 auto;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:700;color:var(--ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-right:1px solid var(--line)}
.calcells{position:relative;flex:0 0 auto}
.cb{position:absolute;top:6px;bottom:6px;border-radius:8px;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;padding:0 7px;white-space:nowrap;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cb.a{background:#f0616d} .cb.b{background:#2a5db0} .cb.o{background:#8a94a6} .cb.x{background:#dfe3ea;color:#7a8496;cursor:default}
.cb:hover{filter:brightness(1.06)}
.sheetbg{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 20px calc(env(safe-area-inset-bottom) + 20px);box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.sheet .kv span{color:var(--sub)}
.sheet .close{margin-top:14px;width:100%;border:0;border-radius:12px;padding:12px;background:#eef0f4;font-weight:700;font-size:14px;cursor:pointer}
@media (min-width:960px){
  .calwrap{max-height:calc(100vh - 200px)}
  .sheetbg{align-items:center}
  .sheet{border-radius:20px}
}
.brand{display:none}
.navfoot{display:none}
.wide-only{display:none}
@media (min-width:960px){
  nav{top:0;bottom:0;right:auto;width:228px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:24px 14px;background:#fff}
  nav .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;color:var(--navy);padding:2px 10px 24px}
  nav .brand img{width:32px;height:32px;border-radius:9px}
  nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;padding:11px 14px;border-radius:12px;cursor:pointer}
  nav button:hover{background:#f3f4f8}
  nav button.on{background:#eef1ff;color:var(--accent)}
  nav .navfoot{display:block;margin-top:auto;font-size:11px;color:var(--mute);padding:0 10px;line-height:1.6}
  header,main{margin-left:228px}
  header{padding:20px 32px 8px}
  header>*{max-width:1560px;margin-left:auto;margin-right:auto}
  h1{font-size:26px}
  .upd{font-size:12px;margin-top:2px}
  .btn-ref,.chip,.seg button,.chart rect{cursor:pointer}
  .btn-ref:hover{background:#eef1ff}
  .chip:hover{color:var(--ink)}
  main{padding:6px 32px 40px}
  main>*{max-width:1560px;margin-left:auto;margin-right:auto}
  .card{padding:22px 24px;border-radius:20px}
  .sec{margin:28px 2px 8px}
  .sec h2{font-size:17px}
  .wide-only{display:inline}
  .top2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:10px;margin-bottom:6px}
  .top2>.card,.top2>.tiles{margin:0}
  .top2 .tiles{grid-template-columns:1fr;gap:12px}
  .top2 .tile{display:grid;grid-template-columns:1fr auto;grid-template-areas:"l v" "s v";align-items:center;column-gap:16px;padding:16px 22px;border-radius:18px}
  .top2 .tile .lbl{grid-area:l}
  .top2 .tile .s{grid-area:s}
  .top2 .tile .v{grid-area:v;font-size:26px;margin:0;text-align:right}
  .top2 .tile .lbl{font-size:13px}
  .top2 .tile .s{font-size:11.5px}
  .hero .big{font-size:52px}
  .hero .lbl{font-size:13.5px}
  .hero .split{height:8px;margin-top:14px}
  .top2.pl{grid-template-columns:1fr 2fr}
  .top2.pl .hero{display:flex;flex-direction:column;justify-content:center}
  .list.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;background:transparent;box-shadow:none;overflow:visible}
  .list.grid .it{background:#fff;border-radius:18px;border-top:0;box-shadow:0 1px 3px rgba(16,24,40,.05);padding:16px 18px;transition:box-shadow .15s}
  .list.grid .it:hover{box-shadow:0 6px 18px rgba(16,24,40,.08)}
  .room .ring,.room .ring svg{width:62px;height:62px}
  .bkcols{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start}
  .bkcols .sec:first-child,.bkcols .day:first-child{margin-top:8px}
  .today3{grid-template-columns:repeat(3,1fr);gap:14px}
  .today3 .tile{padding:16px 20px}
  .today3 .tile .v{font-size:26px}
  .bk:hover,.dept:hover{background:#fafbfd}
}
/* ===== PC版（スマホ版とは別デザイン） ===== */
#pcapp{display:none}
body.pc{background:#f5f6f8}
body.pc>header,body.pc>main,body.pc>nav{display:none!important}
body.pc #pcapp{display:flex;min-height:100vh;font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#1f2a44}
.pside{width:220px;flex:0 0 220px;background:#fff;border-right:1px solid #e5e8ee;position:sticky;top:0;height:100vh;padding:20px 12px 16px;display:flex;flex-direction:column;box-sizing:border-box}
.pbrand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:16px;padding:0 8px 14px;border-bottom:1px solid #eef0f4;margin-bottom:4px}
.pbrand img{width:30px;height:30px;border-radius:8px}
.pgrp{font-size:11px;color:#9aa3b2;font-weight:700;letter-spacing:.1em;margin:16px 10px 6px}
.pnav a{display:block;padding:8px 12px;border-radius:7px;color:#374151;font-size:13.5px;cursor:pointer;font-weight:500;margin:1px 0}
.pnav a:hover{background:#f2f4f8}
.pnav a.on{background:#1f2a44;color:#fff;font-weight:700}
.pfoot{margin-top:auto;font-size:11px;color:#9aa3b2;line-height:1.8;padding:0 10px}
.pfoot a{color:#4263eb;cursor:pointer;font-weight:700}
.pmain{flex:1;min-width:0;padding:24px 32px 40px;box-sizing:border-box}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 16px;flex-wrap:wrap}
.phead h1{font-size:22px;margin:0;font-weight:800;letter-spacing:.01em}
.phead .sub{font-size:12px;color:#6b7280;margin-top:5px;max-width:860px;line-height:1.6}
.pctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.plbl{font-size:12px;color:#6b7280;font-weight:600}
.psel,.pbtn{height:34px;border:1px solid #d5d9e2;border-radius:7px;background:#fff;padding:0 12px;font-size:13px;color:#1f2a44;font-weight:600;font-family:inherit;cursor:pointer;box-sizing:border-box}
.psel.kw{width:180px;cursor:text;font-weight:500}
.psel:focus{outline:2px solid #c5d0fa;border-color:#4263eb}
.pseg{display:inline-flex;border:1px solid #d5d9e2;border-radius:7px;overflow:hidden;background:#fff}
.pseg button{border:0;border-left:1px solid #d5d9e2;background:transparent;padding:0 13px;height:32px;font-size:12.5px;font-weight:600;color:#6b7280;cursor:pointer;font-family:inherit}
.pseg button:first-child{border-left:0}
.pseg button:hover{color:#1f2a44}
.pseg button.on{background:#1f2a44;color:#fff}
.pkpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.pkpis.k5{grid-template-columns:repeat(5,1fr)}
.pkpis.k2{grid-template-columns:repeat(2,1fr)}
.pk{background:#fff;border:1px solid #e5e8ee;border-radius:10px;padding:14px 18px}
.pk .l{font-size:12px;color:#6b7280;font-weight:600}
.pk .v{font-size:26px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pk .s{font-size:11.5px;color:#8a93a3;margin-top:3px}
.pcard{background:#fff;border:1px solid #e5e8ee;border-radius:10px;margin-bottom:12px}

<script>
/* ================= PC版（スマホ版とは別に、スプレッドシートの項目を一から設計） ================= */

function pcBars(el, labels, vals, sel, fut, onTap, stack) {

/* ---------- レビュー_文面 ---------- */
function pcRvText() {

<script>
var D = null, tab = 'home', month = '', sortBy = 'order', plKey = 'sales', plMonth = '';
var $ = function (id) { return document.getElementById(id); };
function yen(n) { return '¥' + Math.round(n || 0).toLocaleString('ja-JP'); }
function man(n) { var a = Math.abs(n); return (n < 0 ? '-' : '') + (a >= 10000 ? (a / 10000).toFixed(a >= 1000000 ? 0 : 1) + '万' : Math.round(a).toLocaleString('ja-JP')); }
function pct(x) { return (x * 100).toFixed(1) + '%'; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function days(m) { var p = m.split('-'); return new Date(+p[0], +p[1], 0).getDate(); }
function prevM(m) { var p = m.split('-').map(Number); var d = new Date(p[0], p[1] - 2, 1); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
function mLabel(m) { var p = m.split('-'); return +p[1] + '月'; }
function md(d) { var p = d.split('-'); var w = '日月火水木金土'[new Date(+p[0], +p[1] - 1, +p[2]).getDay()]; return +p[1] + '/' + +p[2] + '(' + w + ')'; }
function siteTag(s) { var l = s.toLowerCase(); return l.indexOf('airbnb') >= 0 ? '<span class="site air">Airbnb</span>' : l.indexOf('booking') >= 0 ? '<span class="site bkg">Booking</span>' : '<span class="site oth">' + esc(s || '手動') + '</span>'; }
function occColor(p) { return p >= 0.8 ? '#0f9d6b' : p >= 0.6 ? '#4263eb' : p >= 0.4 ? '#f59f00' : '#e0464f'; }
function ring(p, size) {
  var r = 22, c = 2 * Math.PI * r, v = Math.max(0, Math.min(p, 1)), col = occColor(p);
  return '<div class="ring"' + (size ? ' style="width:' + size + 'px;height:' + size + 'px"' : '') + '><svg viewBox="0 0 54 54"' + (size ? ' style="width:' + size + 'px;height:' + size + 'px"' : '') + '><circle cx="27" cy="27" r="' + r + '" fill="none" stroke="#eef0f4" stroke-width="6"/>' +
    '<circle cx="27" cy="27" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + (c * v) + ' ' + c + '"/></svg>' +
    '<div class="t"><b style="color:' + col + '">' + Math.round(p * 100) + '%</b><small>稼働率</small></div></div>';
}
function badge(cur, prev) {
  if (!prev) return '<span class="badge flat">前月なし</span>';

}

var API = 'https://script.google.com/macros/s/AKfycbxYdyky79oop-mM8T8gk2QiRBm0jgqohVDr77XzKpQJyoBNetByZJKHkpMRvOlXdSYFjw/exec';
var KEY = '';
(function () {
  var m = (location.hash + '&' + location.search).match(/[#?&]k=([A-Za-z0-9]+)/);
  try {
    if (m) { KEY = m[1]; localStorage.setItem('minpaku_key', KEY); }
    else KEY = localStorage.getItem('minpaku_key') || '';
  } catch (e) { if (m) KEY = m[1]; }
})();
function askKey(msg) {
  $('upd').textContent = '';
  $('main').innerHTML = '<div class="card"><div style="font-weight:800;margin-bottom:8px">合言葉を入れてください</div>' +
    '<div class="small" style="margin-bottom:10px">' + (msg || '管理者から届いたURLを開くと自動で入ります。') + '</div>' +
    '<input id="kin" style="width:100%;font-size:16px;padding:10px;border:1px solid #dfe3ea;border-radius:10px" autocomplete="off">' +
    '<button id="kok" class="btn-ref" style="margin-top:10px;background:var(--navy);color:#fff;padding:9px 18px">開く</button></div>';
  $('kok').onclick = function () {
    KEY = $('kin').value.trim();
    try { localStorage.setItem('minpaku_key', KEY); } catch (e) {}

function load(force) {
  if (!KEY) { askKey(); return; }
  $('upd').textContent = '読み込み中…';
  fetch(API + '?api=1&k=' + encodeURIComponent(KEY) + (force ? '&force=1' : '') + '&t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.error === 'key') { try { localStorage.removeItem('minpaku_key'); } catch (e) {} KEY = ''; askKey('合言葉が違います（変更された可能性があります）。'); return; }
      D = d;

      if (!plMonth) plMonth = D.plMonth || cur;
      $('upd').textContent = '最終取得 ' + D.updated;
      render();

    })
    .catch(function (e) {
      $('upd').textContent = '';
      $('main').innerHTML = '<div class="card">読み込めませんでした。電波の良い所で「↻ 更新」を押してください。<div class="small" style="margin-top:6px">' + esc(e.message || e) + '</div></div>';
    });

function totals(m) {
  var a = D.agg[m] || {}, t = { net: 0, gross: 0, fee: 0, nights: 0, block: 0, air: 0, bkg: 0, avail: 0 };
  D.rooms.forEach(function (r) {
    var x = a[r]; var dd = days(m);

    t.avail += dd - (x ? x.block : 0);

}
function ymLabel(m) { var p = m.split('-'); return (p[0].slice(2)) + '年' + (+p[1]) + '月'; }

function isWide() { return window.matchMedia('(min-width:960px)').matches; }
function barChart(vals, labels, selIdx, W, H) {
  W = W || 340; H = H || 150;
  var wide = W > 560, pad = wide ? 24 : 18, top = wide ? 22 : 8, fs = wide ? 12 : 9, n = vals.length, max = Math.max.apply(null, vals.concat([1])), min = Math.min.apply(null, vals.concat([0]));
  var span = max - min || 1, bw = (W - 8) / n, zero = top + (H - pad - top) * (max / span);
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" style="height:' + H + 'px">';
  s += '<line x1="0" x2="' + W + '" y1="' + zero + '" y2="' + zero + '" stroke="#e3e6ec"/>';
  vals.forEach(function (v, i) {
    var h = Math.abs(v) / span * (H - pad - top), x = 4 + i * bw + bw * (wide ? 0.24 : 0.18), w = bw * (wide ? 0.52 : 0.64);
    var y = v >= 0 ? zero - h : zero;
    var col = i === selIdx ? '#1f2a44' : v < 0 ? '#f3a3a8' : '#c7d2fe';
    s += '<rect data-i="' + i + '" x="' + x + '" y="' + y + '" width="' + w + '" height="' + Math.max(h, 1) + '" rx="3" fill="' + col + '"/>';
    s += '<rect data-i="' + i + '" x="' + (4 + i * bw) + '" y="0" width="' + bw + '" height="' + H + '" fill="transparent"/>';
    s += '<text x="' + (4 + i * bw + bw / 2) + '" y="' + (H - 4) + '" font-size="' + fs + '" text-anchor="middle" fill="' + (i === selIdx ? '#1f2a44' : '#9aa3b2') + '" font-weight="' + (i === selIdx ? 800 : 500) + '">' + labels[i] + '</text>';
    if (wide && v) s += '<text x="' + (4 + i * bw + bw / 2) + '" y="' + (v >= 0 ? zero - h - 6 : zero + h + 14) + '" font-size="11" text-anchor="middle" fill="' + (i === selIdx ? '#1f2a44' : '#6b7280') + '" font-weight="' + (i === selIdx ? 800 : 600) + '">' + man(v) + '</text>';
  });
  s += '</svg>';

}
function drawChart(id, vals, labels, sel, onTap) {
  var el = $(id); if (!el) return;

  h += '<div class="occlg"><span>稼働率の色：</span><span><span class="dot" style="background:#0f9d6b"></span>80%以上</span><span><span class="dot" style="background:#4263eb"></span>60〜79%</span><span><span class="dot" style="background:#f59f00"></span>40〜59%</span><span><span class="dot" style="background:#e0464f"></span>40%未満</span></div>';

function renderSheet() {
  $('ttl').textContent = sheetName;
  chips(SHEETS, sheetName, function (n) { return n; }, function (n) { sheetName = n; renderSubnav(); render(); });
  var S = SH[sheetName];
  var z = shZoom || (isWide() ? (window._fitZ || 1) : 0.7);
  var h = '<div class="shbar"><span class="small" id="shupd">' + (S ? 'シートの取得 ' + S.updated + '（1時間ごと・「↻ 更新」で今の内容に）' : '') + '</span>' +
    '<div class="shzoom"><button data-z="-">－</button><button data-z="0">' + Math.round(z * 100) + '%</button><button data-z="+">＋</button></div></div>';
  if (sheetName === 'ダッシュボード' && isWide() && D.months.length) h += '<div class="shtop"><div class="card"><div class="sec" style="margin:0 0 6px"><h2>月別の手取り（直近12か月）</h2><span class="small">濃い棒が今月</span></div><div id="shc"></div></div></div>';
  h += '<div class="shwrap" id="shbox">' + (S ? '' : '<div class="shload"><div class="spin" style="margin:0 auto 10px"></div>シートを読み込んでいます（初めては20秒ほどかかることがあります）</div>') + '</div>';
  h += '<div class="note">スプレッドシートの内容を見やすく表示しています（見るだけ）。説明のあるセルはマウスを乗せると表示されます。</div>';
  $('main').innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll('.shzoom button'), function (b) {
    b.onclick = function () {
      var d = b.getAttribute('data-z'), cur = shZoom || (isWide() ? (window._fitZ || 1) : 0.7);
      shZoom = d === '+' ? Math.min(2, cur + 0.1) : d === '-' ? Math.max(0.3, cur - 0.1) : null;
      if (shZoom) shZoom = Math.round(shZoom * 100) / 100; render();
    };
  });
  if ($('shc')) { var lm = D.months.slice(-12), cm = D.today.slice(0, 7); drawChart('shc', lm.map(function (m) { return totals(m).net; }), lm.map(mLabel), lm.indexOf(cm), function () {}); }
  if (!S) {
    var want = sheetName;
    fetchSheet(want).then(function () { if (tab === 'sheet' && sheetName === want) render(); },
      function (e) { if (tab === 'sheet' && sheetName === want) $('shbox').innerHTML = '<div class="shload">' + esc(e.message || e) + '<br>「↻ 更新」を押してください</div>'; });
    return;
  }
  var g = sgHtml(S), box = $('shbox');
  if (isWide() && !shZoom) {
    // PCでは画面の幅に合わせて少し大きく表示（最大1.25倍）
    var fit = Math.max(0.8, Math.min(1.25, (box.clientWidth - 40) / g.w));
    fit = Math.floor(fit * 20) / 20;
    if (fit !== z) { window._fitZ = fit; z = fit; var zb = document.querySelector('.shzoom button[data-z="0"]'); if (zb) zb.textContent = Math.round(z * 100) + '%'; }
  }
  box.innerHTML = '<div style="zoom:' + z + '">' + g.html + '</div>';
}

/* ---------- 予約カレンダー ---------- */
var calJump = '';
function ymdAdd(d, n) { return addD(d, n); }
function lastOfMonth(ymd) { var p = ymd.split('-').map(Number); return new Date(Date.UTC(p[0], p[1], 0)).toISOString().slice(0, 10); }
function dayDiff(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / 86400000); }
function renderCal() {
  $('ttl').textContent = '予約カレンダー';
  var items = (D.cal || []).filter(function (b) { return D.rooms.indexOf(b.room) >= 0; });
  var start = D.today.slice(0, 8) + '01';
  start = addD(start, -1).slice(0, 8) + '01';
  var lastCo = D.today;
  items.forEach(function (b) { if (b.co > lastCo) lastCo = b.co; if (b.ci < start) {} });
  var end = addD(lastOfMonth(lastCo), 1);
  if (dayDiff(D.today, end) < 60) end = addD(lastOfMonth(addD(D.today, 60)), 1);
  var n = dayDiff(start, end), days = [];
  for (var i = 0; i < n; i++) days.push(addD(start, i));
  var months = []; days.forEach(function (d) { var m = d.slice(0, 7); if (months.indexOf(m) < 0) months.push(m); });
  chips(['today'].concat(months), calJump || 'today', function (m) { return m === 'today' ? '今日' : ymLabel(m); }, function (m) { calJump = m; render(); });
  var wide = isWide(), CW = wide ? 42 : 36, NW = wide ? 200 : 96, RH = wide ? 44 : 40, HH = 78;
  var W = n * CW;
  var occ = D.rooms.map(function () { return new Array(n).fill(false); });
  var rowsHtml = D.rooms.map(function () { return ''; });
  items.sort(function (a, b) { return a.ci < b.ci ? -1 : 1; });
  items.forEach(function (b, idx) {
    if (b.co <= start || b.ci >= end) return;
    var ri = D.rooms.indexOf(b.room), s = b.ci < start ? start : b.ci, e = b.co > end ? end : b.co;
    var i0 = dayDiff(start, s), len = dayDiff(s, e);
    for (var k = 0; k < len; k++) occ[ri][i0 + k] = true;
    var txt = b.k === 'x' ? 'ブロック' : (b.ci < start ? '‹ ' : '') + yen(b.gross) + '・' + b.n + '泊' + (b.g ? ' ' + b.g + '名' : '');
    rowsHtml[ri] += '<div class="cb ' + b.k + '" data-i="' + idx + '" style="left:' + (i0 * CW + 3) + 'px;width:' + (len * CW - 6) + 'px" title="' + esc(b.room + ' ' + b.ci + '→' + b.co) + '"><span>' + (len * CW > 70 || b.k === 'x' ? esc(txt) : '') + '</span></div>';
  });
  var WD = '日月火水木金土', head = '', grid = '';
  months.forEach(function (m) { var i = Math.max(0, dayDiff(start, m + '-01')); head += '<div class="calmon" style="left:' + (i * CW) + 'px">' + ymLabel(m) + '</div>'; });
  days.forEach(function (d, i) {
    var w = new Date(Date.parse(d)).getUTCDay(), free = 0;
    occ.forEach(function (r) { if (!r[i]) free++; });
    var cls = 'calday' + (w === 6 ? ' sat' : w === 0 ? ' sun' : '') + (d === D.today ? ' today' : '') + (free === 0 ? ' full' : '');
    head += '<div class="' + cls + '" style="left:' + (i * CW) + 'px;width:' + CW + 'px"><b>' + (+d.slice(8)) + '</b><small>' + WD[w] + '</small><em>' + free + '</em></div>';
    grid += '<i class="' + (d === D.today ? 'td' : (w === 6 || w === 0) ? 'we' : '') + '" style="left:' + (i * CW) + 'px;width:' + CW + 'px"></i>';
  });
  var h = '<div class="calbar"><div class="calleg"><span><i style="background:#f0616d"></i>Airbnb</span><span><i style="background:#2a5db0"></i>Booking.com</span><span><i style="background:#8a94a6"></i>その他・手動</span><span><i style="background:#dfe3ea"></i>ブロック</span></div><span class="small">帯をタップで内訳・日付の下の数字は空室数</span></div>';
  h += '<div class="calwrap" id="calbox" style="--nw:' + (NW + 6) + 'px"><div class="calin" style="width:' + (NW + W) + 'px">';
  h += '<div class="calhead" style="height:' + HH + 'px"><div class="calcorner" style="width:' + NW + 'px"><b id="calmon"></b><span>空室 →</span></div><div class="caldays" style="width:' + W + 'px">' + head + '</div></div>';
  h += '<div style="position:relative"><div class="calgrid" style="left:' + NW + 'px;width:' + W + 'px">' + grid + '</div>';
  D.rooms.forEach(function (r, i) {
    h += '<div class="calrow" style="height:' + RH + 'px"><div class="calname" style="width:' + NW + 'px" title="' + esc(r) + '">' + esc(r) + '</div><div class="calcells" style="width:' + W + 'px">' + rowsHtml[i] + '</div></div>';
  });
  h += '</div></div></div><div class="note">確認済みの予約とブロックを表示（キャンセルは除く）。帯の金額は販売額（清掃費込み）。</div>';
  $('main').innerHTML = h;
  var box = $('calbox'), target = calJump && calJump !== 'today' ? calJump + '-01' : addD(D.today, -1);
  box.scrollLeft = Math.max(0, dayDiff(start, target) * CW);
  var setMon = function () { var i = Math.min(n - 1, Math.max(0, Math.floor((box.scrollLeft + 4) / CW))); var d = days[i]; $('calmon').textContent = +d.slice(5, 7) + '月'; };
  setMon(); box.addEventListener('scroll', setMon, { passive: true });
  Array.prototype.forEach.call(box.querySelectorAll('.cb'), function (el) {
    el.onclick = function () { var b = items[+el.getAttribute('data-i')]; if (b && b.k !== 'x') showBooking(b); };
  });
}
function showBooking(b) {
  var label = { a: 'Airbnb', b: 'Booking.com', o: 'その他・手動' }[b.k];
  var kv = function (k, v) { return '<div class="kv"><span>' + k + '</span><b class="num">' + v + '</b></div>'; };
  var h = '<div class="sheet"><div class="small">' + label + (b.st ? '（' + esc(b.st) + '）' : '') + '</div><h3>' + esc(b.room) + '</h3>';
  h += '<div class="small" style="margin-bottom:10px">' + md(b.ci) + ' → ' + md(b.co) + '・' + b.n + '泊' + (b.g ? '・' + b.g + '名' : '') + (b.c ? '・' + esc(b.c) : '') + '</div>';
  h += kv('販売', yen(b.gross) + (b.n ? '<span class="small">（1泊 ' + yen(b.gross / b.n) + '）</span>' : ''));
  if (b.fee) h += kv('OTA手数料', yen(b.fee));
  h += kv('受取金（手取り）', yen(b.net));
  if (b.cln) h += kv('うち清掃費', yen(b.cln));
  if (b.code) h += kv('予約コード', esc(b.code));
  h += '<button class="close">閉じる</button></div>';
  var bg = document.createElement('div'); bg.className = 'sheetbg'; bg.innerHTML = h;
  bg.onclick = function (e) { if (e.target === bg || e.target.className === 'close') document.body.removeChild(bg); };
  document.body.appendChild(bg);
}

/* ---------- 損益 ---------- */
function renderPL() {
  $('ttl').textContent = '損益';
  var tr = D.trends[plKey];
  if (!tr) { $('main').innerHTML = '<div class="card">損益_部門別の年度推移が見つかりません</div>'; return; }
  if (tr.months.indexOf(plMonth) < 0) plMonth = tr.months.indexOf(D.today.slice(0, 7)) >= 0 ? D.today.slice(0, 7) : tr.months[0];
  chips(tr.months, plMonth, ymLabel, function (m) { plMonth = m; render(); });
  var idx = tr.months.indexOf(plMonth), names = { sales: '売上（手取り）', op: '営業利益', ebitda: 'EBITDA' };
  var h = '<div style="margin-top:6px" class="seg">' + ['sales', 'op', 'ebitda'].map(function (k) { return '<button data-k="' + k + '" class="' + (k === plKey ? 'on' : '') + '">' + { sales: '売上', op: '営業利益', ebitda: 'EBITDA' }[k] + '</button>'; }).join('') + '</div>';
  var tot = tr.total[idx] || 0, ytd = tr.total.slice(0, idx + 1).reduce(function (s, v) { return s + (v || 0); }, 0);
  h += '<div class="top2 pl"><div class="card hero"><div class="lbl">' + ymLabel(plMonth) + 'の' + names[plKey] + '（全部門）</div><div class="big num' + (tot < 0 ? ' neg' : '') + '">' + yen(tot) + '</div>';
  h += '<div class="small">年度累計（' + mLabel(tr.months[0]) + '〜' + mLabel(plMonth) + '） ' + yen(ytd) + '</div></div>';
  h += '<div class="card"><div class="sec" style="margin:0 0 6px"><h2>月別</h2><span class="small">棒をタップで月を切替</span></div><div id="pc"></div></div></div>';
  var rows = tr.rows.map(function (r) { return { n: r.name, v: r.vals[idx] || 0 }; }).sort(function (a, b) { return b.v - a.v; });
  var mx = Math.max.apply(null, rows.map(function (r) { return Math.abs(r.v); }).concat([1]));
  h += '<div class="sec"><h2>部門別</h2></div><div class="list grid">';
  rows.forEach(function (r) {
    h += '<div class="it dept"><div class="top"><div class="nm">' + esc(r.n) + '</div><div class="v num' + (r.v < 0 ? ' neg' : '') + '">' + yen(r.v) + '</div></div>' +
      '<div class="bar"><i style="width:' + (Math.abs(r.v) / mx * 100) + '%;background:' + (r.v < 0 ? '#f3a3a8' : '#5b7cfa') + '"></i></div></div>';
  });
  h += '</div><div class="note">経費は経理の部門別損益計算書。経理データがまだ無い月は経費0のため、営業利益＝売上になります。</div>';
  $('main').innerHTML = h;
  drawChart('pc', tr.total.map(function (v) { return v || 0; }), tr.months.map(mLabel), idx, function (i) { plMonth = tr.months[i]; render(); });
  Array.prototype.forEach.call(document.querySelectorAll('.seg button[data-k]'), function (bt) { bt.onclick = function () { plKey = bt.getAttribute('data-k'); render(); }; });
}

function render() {
  if (!D) return;
  if (isWide()) { renderPC(); return; }
  document.body.classList.remove('pc');
  if (tab === 'sheet' && !isWide()) tab = 'home', setNavOn();
  document.body.classList.toggle('tsheet', tab === 'sheet');
  if (tab === 'home') renderHome(); else if (tab === 'cal') renderCal(); else if (tab === 'sheet') renderSheet(); else if (tab === 'book') renderBook(); else renderPL();
  renderSubnav();
}
function setNavOn() { Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (x) { x.classList.toggle('on', x.getAttribute('data-tab') === tab); }); }
Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
  b.onclick = function () { tab = b.getAttribute('data-tab'); setNavOn(); render(); window.scrollTo(0, 0); };
});
$('ref').onclick = function () {
  if (tab === 'sheet') { delete SH[sheetName]; delete shLoading[sheetName]; render(); fetchSheet(sheetName, true).then(function () { render(); }, function () { render(); }); return; }
  load(true);
};
var _rz = null, _wasWide = isWide(), _lastW = window.innerWidth;
window.addEventListener('resize', function () {
  clearTimeout(_rz);
  _rz = setTimeout(function () { if (Math.abs(window.innerWidth - _lastW) > 40 || isWide() !== _wasWide) { _lastW = window.innerWidth; _wasWide = isWide(); render(); } }, 200);
});
load(false);
</script>
